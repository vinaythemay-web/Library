<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryMS — Return Books</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lending-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: all 0.12s; cursor: pointer;
      margin-bottom: 10px;
    }
    .lending-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .lending-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .lending-card.overdue  { border-left: 3px solid var(--danger); }
    .lc-icon {
      width: 40px; height: 40px; border-radius: 8px;
      background: var(--bg); display: flex; align-items: center;
      justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .lc-body { flex: 1; min-width: 0; }
    .lc-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lc-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .lc-right { text-align: right; flex-shrink: 0; }
    .lc-due { font-size: 12px; font-weight: 500; }
    .lc-fine { font-size: 13px; font-weight: 600; color: var(--danger); }

    .return-panel {
      position: sticky; top: 24px;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <h1>Return a Book</h1>
      <p>Select a lending to process the return and calculate any fine</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start">
      <!-- Left: Active lendings list -->
      <div>
        <!-- Toolbar -->
        <div class="toolbar" style="margin-bottom:16px">
          <div class="search-wrap" style="flex:1">
            <span class="search-icon"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" placeholder="Search by member name or book title…" id="returnSearch" oninput="applyFilter()" style="padding-left:36px">
          </div>
          <select class="filter-select" id="statusFilter" onchange="applyFilter()">
            <option value="active">Active lendings</option>
            <option value="overdue">Overdue only</option>
            <option value="all">All incl. returned</option>
          </select>
        </div>

        <div id="lendingsList"></div>
      </div>

      <!-- Right: Return panel -->
      <div class="return-panel">
        <div class="card" id="returnPanel">
          <div id="panelEmpty" style="text-align:center;padding:32px 0;color:var(--text-muted)">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 10px;display:block;opacity:0.3"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5"/></svg>
            <p style="font-size:13px">Select a lending from the list to process return</p>
          </div>

          <div id="panelFilled" style="display:none">
            <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">Process Return</h3>

            <div class="summary-box" style="margin-bottom:16px">
              <div class="summary-row"><span class="summary-label">Member</span><span class="summary-value" id="rMember">—</span></div>
              <div class="summary-row"><span class="summary-label">Book</span><span class="summary-value" id="rBook">—</span></div>
              <div class="summary-row"><span class="summary-label">Lent on</span><span class="summary-value" id="rLentDate">—</span></div>
              <div class="summary-row"><span class="summary-label">Due date</span><span class="summary-value" id="rDueDate">—</span></div>
              <div class="summary-row"><span class="summary-label">Days lent</span><span class="summary-value" id="rDaysLent">—</span></div>
            </div>

            <div id="fineSection" style="display:none" class="fine-box" style="margin-bottom:16px">
              <div>
                <div class="fine-label">Overdue fine</div>
                <div style="font-size:12px;color:#991b1b;margin-top:2px" id="rOverdueDays">—</div>
              </div>
              <div class="fine-amount" id="rFine">₹0</div>
            </div>

            <div id="noFineSection" class="alert alert-success" style="margin-bottom:16px;display:none">
              ✅ Returned on time — no fine
            </div>

            <!-- Admin fine override -->
            <div class="form-group" id="fineOverrideGroup" style="display:none">
              <label for="fineOverride" style="display:flex;justify-content:space-between;align-items:center">
                <span>Final Fine Amount (₹)</span>
                <span style="font-size:11px;color:var(--text-muted);font-weight:400">Admin override</span>
              </label>
              <input type="number" id="fineOverride" min="0" step="1" placeholder="0"
                style="max-width:160px" oninput="updateFinePreview()">
              <p style="font-size:12px;color:var(--text-muted);margin-top:4px">Leave blank to use auto-calculated fine.</p>
            </div>

            <div class="form-group">
              <label>Return date</label>
              <input type="date" id="returnDate">
            </div>

            <div id="msgReturn"></div>

            <button class="btn btn-success" style="width:100%;justify-content:center;padding:10px;font-size:14px" id="returnBtn" onclick="processReturn()" data-label="Confirm Return">
              Confirm Return
            </button>
          </div>
        </div>

        <!-- Return history -->
        <div class="card" style="margin-top:16px">
          <div class="card-header" style="margin-bottom:14px">
            <span class="card-title">Recently Returned</span>
            <button class="btn btn-secondary btn-sm" onclick="loadHistory()">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.3L2 8"/></svg>
              Refresh
            </button>
          </div>
          <div id="historyList"></div>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
let allLendings = [];
let selectedLending = null;

async function init() {
  const profile = await initSidebar('returning');
  if (profile?.role !== 'admin') { window.location.href = 'dashboard.html'; return; }
  document.getElementById('returnDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('returnDate').addEventListener('change', updateFineDisplay);
  await loadLendings();
  await loadHistory();
}

async function loadLendings() {
  const { data, error } = await supabase
    .from('lendings')
    .select('*, book:books(id, title, genre, available_copies), member:profiles(id, name, member_id, email)')
    .neq('status', 'returned')
    .order('due_date', { ascending: true });

  if (error) { showToast('Failed to load lendings', 'error'); return; }
  allLendings = data || [];
  applyFilter();
}

async function loadHistory() {
  const { data } = await supabase
    .from('lendings')
    .select('*, book:books(title), member:profiles(name)')
    .eq('status', 'returned')
    .order('returned_at', { ascending: false })
    .limit(5);

  const el = document.getElementById('historyList');
  if (!data || !data.length) { el.innerHTML = `<p style="font-size:13px;color:var(--text-muted);text-align:center;padding:12px">No returns yet</p>`; return; }
  el.innerHTML = data.map(l => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start">
      <div>
        <div style="font-size:13px;font-weight:500">${l.book?.title || '—'}</div>
        <div style="font-size:12px;color:var(--text-muted)">${l.member?.name || '—'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--text-muted)">${formatDate(l.returned_at)}</div>
          ${l.fine_amount > 0 ? `<div style="font-size:12px;color:var(--danger);font-weight:500">₹${l.fine_amount} fine</div>` : ''}
        </div>
        <button onclick="deleteHistory('${l.id}', '${(l.book?.title || 'this book').replace(/'/g,"\\'").replace(/"/g, '&quot;')}')" class="btn btn-secondary" style="padding:4px;color:var(--danger);background:transparent;border:none" title="Delete record">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>`).join('');
}

function applyFilter() {
  const q      = document.getElementById('returnSearch').value.toLowerCase().trim();
  const status = document.getElementById('statusFilter').value;
  const today  = new Date(); today.setHours(0,0,0,0);

  let results = allLendings.filter(l => {
    const matchQ = !q ||
      l.member?.name?.toLowerCase().includes(q) ||
      l.book?.title?.toLowerCase().includes(q) ||
      l.member?.member_id?.toLowerCase().includes(q);
    const isOverdue = new Date(l.due_date) < today;
    const matchS = status === 'all' ||
      (status === 'active'  && !isOverdue) ||
      (status === 'overdue' && isOverdue);
    return matchQ && matchS;
  });

  renderLendings(results);
}

function renderLendings(lendings) {
  const el = document.getElementById('lendingsList');
  if (!lendings.length) {
    el.innerHTML = emptyState('No active lendings match your search.');
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  el.innerHTML = lendings.map(l => {
    const due      = new Date(l.due_date);
    const overdue  = due < today;
    const fine     = calcFine(l.due_date);
    const selected = selectedLending?.id === l.id;
    return `
      <div class="lending-card ${overdue ? 'overdue' : ''} ${selected ? 'selected' : ''}"
           onclick='selectLending(${JSON.stringify(l).replace(/'/g,"&#39;")})'>
        <div class="lc-icon">${genreEmoji(l.book?.genre)}</div>
        <div class="lc-body">
          <div class="lc-title">${l.book?.title || '—'}</div>
          <div class="lc-sub">${l.member?.name || '—'} ${l.member?.member_id ? '· ' + l.member.member_id : ''}</div>
        </div>
        <div class="lc-right">
          <div class="lc-due" style="color:${overdue ? 'var(--danger)' : 'var(--text-muted)'}">
            ${overdue ? '⚠ ' : ''}Due ${formatDate(l.due_date)}
          </div>
          ${fine > 0 ? `<div class="lc-fine">₹${fine} fine</div>` : ''}
          <span class="badge ${overdue ? 'badge-overdue' : 'badge-lent'}" style="margin-top:4px">${overdue ? 'Overdue' : 'Active'}</span>
        </div>
      </div>`;
  }).join('');
}

function selectLending(l) {
  selectedLending = l;
  applyFilter(); // re-render with selection highlighted
  showReturnPanel(l);
}

function showReturnPanel(l) {
  document.getElementById('panelEmpty').style.display  = 'none';
  document.getElementById('panelFilled').style.display = '';

  document.getElementById('rMember').textContent  = l.member?.name || '—';
  document.getElementById('rBook').textContent    = l.book?.title  || '—';
  document.getElementById('rLentDate').textContent = formatDate(l.lent_at);
  document.getElementById('rDueDate').textContent  = formatDate(l.due_date);

  const lentDays = Math.round((new Date() - new Date(l.lent_at)) / 86400000);
  document.getElementById('rDaysLent').textContent = lentDays + ' days';

  updateFineDisplay();
  document.getElementById('msgReturn').innerHTML = '';
}

function updateFineDisplay() {
  if (!selectedLending) return;
  const returnDateVal = document.getElementById('returnDate').value || new Date().toISOString().split('T')[0];
  const due     = new Date(selectedLending.due_date);
  const retDate = new Date(returnDateVal);
  due.setHours(0,0,0,0); retDate.setHours(0,0,0,0);
  const overdueDays = Math.max(0, Math.floor((retDate - due) / 86400000));
  const fine = overdueDays * 5;

  if (fine > 0) {
    document.getElementById('fineSection').style.display   = '';
    document.getElementById('noFineSection').style.display = 'none';
    document.getElementById('rOverdueDays').textContent = `${overdueDays} day${overdueDays !== 1 ? 's' : ''} overdue × ₹5/day`;
    document.getElementById('rFine').textContent        = `₹${fine}`;
    document.getElementById('fineOverrideGroup').style.display = '';
    document.getElementById('fineOverride').value = '';
  } else {
    document.getElementById('fineSection').style.display   = 'none';
    document.getElementById('noFineSection').style.display = '';
    document.getElementById('fineOverrideGroup').style.display = 'none';
    document.getElementById('fineOverride').value = '';
  }
}

function updateFinePreview() {
  const override = document.getElementById('fineOverride').value;
  const display = document.getElementById('rFine');
  if (override !== '' && !isNaN(override)) {
    display.textContent = `₹${parseFloat(override)}`;
    display.style.color = '#c2551a';
  } else {
    updateFineDisplay();
  }
}

async function processReturn() {
  if (!selectedLending) return;
  const btn = document.getElementById('returnBtn');
  btn.disabled = true; btn.textContent = 'Processing…';

  const returnDateVal = document.getElementById('returnDate').value || new Date().toISOString().split('T')[0];
  const due     = new Date(selectedLending.due_date);
  const retDate = new Date(returnDateVal);
  due.setHours(0,0,0,0); retDate.setHours(0,0,0,0);
  const overdueDays = Math.max(0, Math.floor((retDate - due) / 86400000));
  const autoFine = overdueDays * 5;

  // Use admin override if provided, otherwise auto-calculated
  const overrideVal = document.getElementById('fineOverride').value;
  const fine = (overrideVal !== '' && !isNaN(overrideVal)) ? parseFloat(overrideVal) : autoFine;

  // Update lending record
  const { error: updateErr } = await supabase.from('lendings').update({
    returned_at:  new Date(returnDateVal).toISOString(),
    fine_amount:  fine,
    status:       'returned'
  }).eq('id', selectedLending.id);

  if (updateErr) {
    document.getElementById('msgReturn').innerHTML = `<div class="alert alert-error">${updateErr.message}</div>`;
    btn.disabled = false; btn.textContent = 'Confirm Return';
    return;
  }

  // Increment available copies
  const currentAvail = selectedLending.book?.available_copies ?? 0;
  await supabase.from('books').update({ available_copies: currentAvail + 1 }).eq('id', selectedLending.book.id);

  showToast(`"${selectedLending.book?.title}" returned successfully!`);
  document.getElementById('msgReturn').innerHTML = `<div class="alert alert-success">
    Return processed! ${fine > 0 ? `Fine collected: ₹${fine}` : 'No fine — returned on time.'}
  </div>`;

  selectedLending = null;
  document.getElementById('panelEmpty').style.display  = '';
  document.getElementById('panelFilled').style.display = 'none';

  btn.disabled = false; btn.textContent = 'Confirm Return';
  await loadLendings();
  await loadHistory();
}

async function deleteHistory(id, title) {
  const confirmed = await customConfirm(
    'Delete Return Record',
    `Are you sure you want to completely delete the return record for "<strong>${title}</strong>"?`,
    'Delete Record',
    'danger'
  );
  if (!confirmed) return;
  
  const { data, error } = await supabase.from('lendings').delete().eq('id', id).select();
  if (error) {
    showToast('Failed to delete record: ' + error.message, 'error');
  } else if (!data || data.length === 0) {
    showToast('Delete blocked! You must add a DELETE policy in Supabase for lendings.', 'error');
  } else {
    showToast('Record deleted successfully!');
    await loadHistory();
  }
}

init();
</script>
</body>
</html>
