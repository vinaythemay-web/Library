<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryMS — My Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; color: var(--primary);
      flex-shrink: 0;
    }
    .profile-header-info { flex: 1; }
    .profile-name { font-size: 20px; font-weight: 600; }
    .profile-email { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px;
    }
    .info-item {
      background: var(--bg); border-radius: 8px; padding: 14px 16px;
      border: 1px solid var(--border);
    }
    .info-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 500; }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary-light); color: var(--primary);
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" style="max-width: 720px;">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>View and update your account details</p>
    </div>

    <div id="msgBar"></div>

    <!-- Profile header card -->
    <div class="card" style="margin-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
        <div class="profile-avatar" id="avatarEl">?</div>
        <div class="profile-header-info">
          <div class="profile-name" id="profileNameDisplay">Loading...</div>
          <div class="profile-email" id="profileEmailDisplay">—</div>
          <div id="roleBadge" style="margin-top:6px;"></div>
        </div>
      </div>

      <div class="info-grid" id="infoGrid">
        <div class="info-item">
          <div class="info-label">Member ID</div>
          <div class="info-value" id="infoMemberId">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Role</div>
          <div class="info-value" id="infoRole">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Member Since</div>
          <div class="info-value" id="infoJoined">—</div>
        </div>
        <div class="info-item">
          <div class="info-label" id="statLabel">Active Lendings</div>
          <div class="info-value" id="infoStat">—</div>
        </div>
      </div>
    </div>

    <!-- Edit card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Edit Profile</span>
      </div>
      <form id="editForm" onsubmit="handleSave(event)">
        <div class="form-group">
          <label for="editName">Full Name</label>
          <input type="text" id="editName" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="text" id="editEmail" disabled style="opacity:0.6;cursor:not-allowed;background:var(--bg)">
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">Email is managed by Supabase auth and cannot be changed here.</p>
        </div>
        <div class="form-group">
          <label for="editPhone">Phone Number (optional)</label>
          <input type="text" id="editPhone" placeholder="+91 98765 43210">
        </div>
        <button type="submit" class="btn btn-primary" id="saveBtn" data-label="Save Changes"
          style="padding: 10px 24px;">
          Save Changes
        </button>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
let currentProfile = null;

async function init() {
  currentProfile = await initSidebar('profile');
  if (!currentProfile) {
    // Fallback: try to load profile directly to show a better error
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
    if (error || !data) {
      document.getElementById('profileNameDisplay').textContent = 'Profile Not Found';
      document.getElementById('msgBar').innerHTML = `
        <div class="alert alert-error">
          ⚠️ Your profile record could not be loaded.
          This usually means your account was created before the database was fully set up.
          Please sign out and register again, or contact an admin.
        </div>`;
      return;
    }
    currentProfile = data;
  }
  renderProfile(currentProfile);
  loadStats(currentProfile);
}

function renderProfile(p) {
  const initials = (p.name || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
  document.getElementById('avatarEl').textContent = initials;
  document.getElementById('profileNameDisplay').textContent = p.name || '—';
  document.getElementById('profileEmailDisplay').textContent = p.email || '—';
  document.getElementById('infoMemberId').textContent = p.member_id || '—';
  document.getElementById('infoRole').textContent = p.role === 'admin' ? 'Administrator' : 'Library Member';
  document.getElementById('infoJoined').textContent = formatDate(p.joined_at);

  if (p.role === 'admin') {
    document.getElementById('roleBadge').innerHTML = `
      <span class="admin-badge">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Administrator
      </span>`;
    document.getElementById('statLabel').textContent = 'Total Books Added';
  } else {
    document.getElementById('roleBadge').innerHTML = `<span class="badge badge-member">Member</span>`;
    document.getElementById('statLabel').textContent = 'Active Lendings';
  }

  // Pre-fill edit form
  document.getElementById('editName').value = p.name || '';
  document.getElementById('editEmail').value = p.email || '';
  document.getElementById('editPhone').value = p.phone || '';
}

async function loadStats(p) {
  if (p.role === 'admin') {
    const { count } = await supabase.from('books').select('id', { count: 'exact', head: true });
    document.getElementById('infoStat').textContent = count ?? '—';
  } else {
    const { count } = await supabase.from('lendings')
      .select('id', { count: 'exact', head: true })
      .eq('member_id', p.id)
      .eq('status', 'active');
    document.getElementById('infoStat').textContent = count ?? '0';
  }
}

async function handleSave(e) {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  setLoading(btn, true, 'Saving...');

  const name = document.getElementById('editName').value.trim();
  const phone = document.getElementById('editPhone').value.trim() || null;

  const { error } = await supabase.from('profiles')
    .update({ name, phone })
    .eq('id', currentProfile.id);

  if (error) {
    document.getElementById('msgBar').innerHTML = `<div class="alert alert-error">Failed to save: ${error.message}</div>`;
  } else {
    currentProfile.name = name;
    document.getElementById('profileNameDisplay').textContent = name;
    const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('avatarEl').textContent = initials;
    document.getElementById('msgBar').innerHTML = `<div class="alert alert-success">✅ Profile updated successfully!</div>`;
    setTimeout(() => { document.getElementById('msgBar').innerHTML = ''; }, 3000);
  }

  setLoading(btn, false);
}

init();
</script>
</body>
</html>
